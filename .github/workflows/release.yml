name: Production Release

on:
  workflow_run:
    workflows: ["Branch Delivery Pipeline"]
    types: [completed]
    branches:
      - main
      - new-deploy-stuff-and-epreprod

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: production-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    uses: JSL-Inc/new-golden-path-workflows/.github/workflows/release.yml@main
